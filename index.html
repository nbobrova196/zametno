    <script>
      // Возвращаем адрес после переадресации через 404.html на GitHub Pages.
      ;(function () {
        var l = window.location
        if (l.search[1] !== '/') return
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (part) {
            return part.replace(/~and~/g, '&')
          })
          .join('?')
        var path = decoded.replace(/^\//, '')
        window.history.replaceState(
          null,
          '',
          l.pathname.replace(/\/$/, '') + '/' + path + l.hash,
        )
      })()
    </script>
